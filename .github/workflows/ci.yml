name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Placeholder email settings so the server's startup check passes. Unit tests mock the
    # transport, and CI never sends real email.
    env:
      GMAIL_USER: not-a-real-account@example.com
      GMAIL_APP_PASSWORD: fakefakefakefake # not a real password
      EMAIL_FROM_NAME: Iskolar
      APP_URL: http://localhost:3000
      # Local test inbox (Mailpit) instead of Gmail; CI never sends real email.
      EMAIL_DEV_SMTP: 127.0.0.1:54325
      EMAIL_DAILY_LIMIT: "100000"
      CRON_SECRET: ci-only-not-a-real-cron-secret-0000 # fake, CI only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare
      - name: Write .env.local from local Supabase
        run: |
          npx supabase status -o json | sed -n '/^{/,$p' | jq -r '
            "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.ANON_KEY)",
            "SUPABASE_SECRET_KEY=\(.SERVICE_ROLE_KEY)"' > .env.local
      - name: Database tests (RLS, triggers, RPCs)
        run: npm run test:db

      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: End-to-end (includes axe accessibility checks)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

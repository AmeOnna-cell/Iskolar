name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare
      - name: Write .env.local from local Supabase
        run: |
          npx supabase status -o json | sed -n '/^{/,$p' | jq -r '
            "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)",
            "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> .env.local
          echo "CRON_SECRET=ci-cron-secret" >> .env.local
      - name: Database tests (RLS, triggers, RPCs)
        run: npm run test:db

      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: End-to-end (includes axe accessibility checks)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
